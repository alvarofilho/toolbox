<text x="64" y="133" font-size="13" fill="#778197">Conversores　/　CSV para JSON</text><text x="64" y="183" font-size="32" font-weight="700">CSV para JSON</text><text x="64" y="215" font-size="15" fill="#667085">Converta linhas CSV em uma estrutura JSON pronta para usar.</text>
